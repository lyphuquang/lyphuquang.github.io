<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Cá Nhân | Lý Phú Quảng</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #0056b3;
            margin-bottom: 10px;
        }
        p {
            line-height: 1.6;
            color: #555;
        }
        .tag {
            display: inline-block;
            background: #e1f0ff;
            color: #0056b3;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Chào mừng bạn đến với Website của tôi!</h1>
        <p>Đây là trang cá nhân lưu trữ trên GitHub Pages.</p>
        <p>Nơi chia sẻ kiến thức, hành trình học tập và những trải nghiệm thực tế.</p>
        <span class="tag">#Maritime #Tech #Blog</span>
    </div>
</body>
</html>
